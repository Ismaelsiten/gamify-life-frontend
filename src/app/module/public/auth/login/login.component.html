<div class="container mt-5" style="max-width: 400px;">
    <h2 class="mb-4 text-center">Iniciar sesión</h2>
  
    <form [formGroup]="loginForm" (ngSubmit)="loginWithEmail()" class="d-grid gap-3">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" />
      </mat-form-field>
  
      <mat-form-field appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input matInput formControlName="password" type="password" />
      </mat-form-field>
  
      <button mat-raised-button color="primary" type="submit">Entrar</button>
    </form>
  
    <hr class="my-4" />
  
    <div class="d-grid gap-2">
      <button class="btn btn-outline-danger" (click)="loginWithGoogle()">Entrar con Google</button>
      <button class="btn btn-outline-dark" (click)="loginWithApple()">Entrar con Apple</button>
    </div>
  </div>
